    const usePreloadedAudio = (src, volume = 0.5) => {
      const ref = React.useRef(null);
      React.useEffect(() => {
        const audio = new Audio(src);
        audio.preload = 'auto';
        audio.volume = volume;
        audio.load();
        ref.current = audio;
        // src が切り替わる（＝言語切り替え等）ときは、直前の音声が再生中でも止めてから差し替える

    const App = () => {
      // 料金プラン設定
      const feeTable = {
        "フルタイム": {
          "月2回": 11480,
          "月3回": 16220,
          "月4回": 20960,
          "月6回": 31440
        },
        "平日フル": {
          "月2回": 10300,
          "月3回": 14450,
          "月4回": 18600,
          "月6回": 27900
        },
        "いつでも夕方": {
          "月2回": 9190,
          "月3回": 12780,
          "月4回": 16380,
          "月6回": 24570
        }
      };

      // 状態管理
      const [currentStep, setCurrentStep] = React.useState(1);
      // 起動直後はブラウザの自動再生制限で音声が鳴らないため、タップ操作を挟むためのフラグ
      const [hasStarted, setHasStarted] = React.useState(false);
      // 表示言語（内部の値・計算ロジックは日本語のまま。表示だけこの値で切り替える）
      const [language, setLanguage] = React.useState('ja');
      const L = UI_TEXT[language];
      const [plan, setPlan] = React.useState("");
      const [frequency, setFrequency] = React.useState("");
      const [nextMonthPlan, setNextMonthPlan] = React.useState("");
      const [nextMonthFrequency, setNextMonthFrequency] = React.useState("");

      const [joinAtTrial, setJoinAtTrial] = React.useState(true);

      const [startTiming, setStartTiming] = React.useState("今月から始める");
      const [changePlanNextMonth, setChangePlanNextMonth] = React.useState(false);
      const [showPlanChangeForm, setShowPlanChangeForm] = React.useState(false);

      // モーダル・遅延適用管理用
      const [showLateModal, setShowLateModal] = React.useState(false);
      const [isDelayedChange, setIsDelayedChange] = React.useState(false);

      // ④のどの画面から⑤に進んだかを記憶する用
      const [lastStep4, setLastStep4] = React.useState(4.5);

      // 金額計算
      const [thisMonthFee, setThisMonthFee] = React.useState(0);
      const [nextMonthFee, setNextMonthFee] = React.useState(0);
      const [registrationFee, setRegistrationFee] = React.useState(5950);
      const [thisMonthTotal, setThisMonthTotal] = React.useState(0);
      const [nextMonthTotal, setNextMonthTotal] = React.useState(0);

      // 日付関連
      const today = new Date();

      // 来月の計算
      const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
      const targetNextMonthNum = nextMonth.getMonth() + 1;

      // N月(今月+2か月)の計算（ポップアップのm月としても使用）
      const targetMonthAfterNext = new Date(today.getFullYear(), today.getMonth() + 2, 1).getMonth() + 1;

      // 英語表示用の月名ヘルパー（日本語は「○月」、英語は月の英語名）
      const monthLabel = (n) => language === 'en' ? MONTH_NAMES_EN[n - 1] : `${n}月`;
      const nextMonthNumLabel = monthLabel(targetNextMonthNum);
      const afterNextMonthLabel = monthLabel(targetMonthAfterNext);

      // プラン変更フォームの「来月」欄見出し（日本語は「来月」/「○月以降」、英語は文脈に応じた表現）
      const nextMonthPlanFieldLabel = language === 'en'
        ? (isDelayedChange ? `Plan from ${afterNextMonthLabel}` : "Next Month's Plan")
        : `${isDelayedChange ? `${targetMonthAfterNext}月以降` : "来月"}のプラン`;
      const nextMonthFreqFieldLabel = language === 'en'
        ? (isDelayedChange ? `Sessions from ${afterNextMonthLabel}` : "Next Month's Sessions")
        : `${isDelayedChange ? `${targetMonthAfterNext}月以降` : "来月"}の回数`;

      // プラン変更適用日の計算（isDelayedChange が true なら再来月の1日、false なら来月の1日）
      const applyMonthOffset = isDelayedChange ? 2 : 1;
      const applyDate = new Date(today.getFullYear(), today.getMonth() + applyMonthOffset, 1);

      const formatDate = (date) => {
        if (language === 'en') {
          return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const day = date.getDate();
        return `${year}年${month}月${day}日`;
      };

      // 利用開始日の計算
      const getStartDate = () => {
        if (startTiming === "今月から始める") {
          return formatDate(today);
        } else {
          const pureNextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
          return formatDate(pureNextMonth);
        }
      };

      // プラン変更チェックボックスがオフになったら遅延フラグもリセット
      React.useEffect(() => {
        if (!changePlanNextMonth) {
          setIsDelayedChange(false);
        }
      }, [changePlanNextMonth]);

      // 金額を再計算
      React.useEffect(() => {
        const currentRegistrationFee = joinAtTrial ? registrationFee - 1000 : registrationFee;

        if (!plan || !frequency) {
          setThisMonthFee(0);
          setNextMonthFee(0);
          setThisMonthTotal(currentRegistrationFee);
          setNextMonthTotal(0);
          return;
        }

        const monthlyFee = feeTable[plan][frequency];

        if (startTiming === "今月から始める") {
          setThisMonthFee(monthlyFee);

          let actualNextMonthFee = monthlyFee; // 今日の費用に含まれる「来月の月謝」
          let afterNextMonthFee = monthlyFee;  // N月以降の月謝

          // プラン変更がある場合
          if (changePlanNextMonth && nextMonthPlan && nextMonthFrequency) {
            const changedFee = feeTable[nextMonthPlan][nextMonthFrequency];

            if (isDelayedChange) {
              // 20日以降で「はい」が選ばれた遅延適用：来月は旧プラン、再来月(N月)から新プラン
              actualNextMonthFee = monthlyFee;
              afterNextMonthFee = changedFee;
            } else {
              // 通常のプラン変更適用：来月から新プラン
              actualNextMonthFee = changedFee;
              afterNextMonthFee = changedFee;
            }
          }

          setNextMonthFee(actualNextMonthFee);
          setThisMonthTotal(currentRegistrationFee + monthlyFee + actualNextMonthFee);
          setNextMonthTotal(afterNextMonthFee);

        } else {
          // 来月から始める場合
          setThisMonthFee(0);
          setNextMonthFee(monthlyFee);
          setThisMonthTotal(currentRegistrationFee + monthlyFee);
          setNextMonthTotal(monthlyFee);
        }
      }, [plan, frequency, joinAtTrial, startTiming, changePlanNextMonth, nextMonthPlan, nextMonthFrequency, isDelayedChange, registrationFee]);

      // 言語切り替えに応じて、タブのタイトルと html の lang 属性を更新
      React.useEffect(() => {
        document.title = L.appTitle;
        document.documentElement.lang = language;
      }, [language]);

      // 音声ファイルのパス（英語モードの時は ./en/ 配下にある「en+元のファイル名」のファイルを参照する）
      // ※決定音・キャンセル音・呼び出し音・歓声など、言葉を含まない効果音は言語に関係なく共通のファイルを使う
      const getAudioPath = (filename) => language === 'en' ? `./en/en${filename}` : `./${filename}`;

      // 各エリアの音声
      const planAudioRef = usePreloadedAudio(getAudioPath('音声プランを決めよう.wav'));
      const confirmDocAudioRef = usePreloadedAudio(getAudioPath('音声確認書を書こう.wav'));
      const termsAudioRef = usePreloadedAudio(getAudioPath('音声受講規約.wav'));
      const soccerAudioRef = usePreloadedAudio(getAudioPath('音声サッカー.wav'));
      const teddyAudioRef = usePreloadedAudio(getAudioPath('音声テディ.wav'));
      const callAudioRef = usePreloadedAudio('./呼び出し音.mp3');
      const kaikeiAudioRef = usePreloadedAudio(getAudioPath('音声お会計.wav'));
      const cheerAudioRef = usePreloadedAudio('./歓声と拍手1.mp3');
      const planChangeDeadlineAudioRef = usePreloadedAudio(getAudioPath('プラン変更事務処理期限.wav'));
      const cashCardAudioRef = usePreloadedAudio(getAudioPath('銀行のキャッシュカードをご用意ください.wav'));
      const accountHomeAudioRef = usePreloadedAudio(getAudioPath('④ご自宅での口座振替のご案内.wav'));
      const accountHomeAudioRef2 = usePreloadedAudio(getAudioPath('④ご自宅での口座振替のご案内2.wav'));
      // ④-5の1本目：日本語は「音声口座登録.wav」、英語は先生用に分割した「④引き落とし登録 振替口座登録.wav」を使う（日英でファイル名が異なる特殊枠）
      const accountRegisterAudioRef = usePreloadedAudio(language === 'en' ? './en/en④引き落とし登録 振替口座登録.wav' : './音声口座登録.wav');
      const accountRegisterAudioRef2 = usePreloadedAudio(getAudioPath('④引き落とし登録 振替口座登録2.wav'));
      const accountWebAudioRef = usePreloadedAudio(getAudioPath('④別の方法(Web)での口座振替のご案内.wav'));
      const reservationAudioRef = usePreloadedAudio(getAudioPath('⑤体験のご予約は？.wav'));
      const planChangeFormAudioRef = usePreloadedAudio(getAudioPath('プラン変更届を書こう.wav'));
      const lineIntroAudioRef = usePreloadedAudio(getAudioPath('音声6,お友達になろう.wav'));
      const lineAccountAudioRef = usePreloadedAudio(getAudioPath('音声LINE友達アカウント作成方法.wav'));
      const welcomeAudioRef = usePreloadedAudio(getAudioPath('音声ようこそ.wav'));

      // ボタン効果音
      const decisionClickAudioRef = usePreloadedAudio('./決定ボタンを押す3.mp3', 0.4);
      const cancelClickAudioRef = usePreloadedAudio('./キャンセル6.mp3', 0.4);

      // エリアのナレーション音声一覧（新しいナレーションを鳴らす前に、前のナレーションを止めるため）
      // ※ボタンのクリック音はここに含めない（クリック音がナレーションに止められて聞こえなくなるのを防ぐため、別チャンネル扱いにする）
      const areaAudioRefs = [
        planAudioRef, confirmDocAudioRef, termsAudioRef, soccerAudioRef, teddyAudioRef,
        callAudioRef, kaikeiAudioRef, cheerAudioRef, planChangeDeadlineAudioRef,
        cashCardAudioRef, accountHomeAudioRef, accountHomeAudioRef2, accountRegisterAudioRef, accountRegisterAudioRef2, accountWebAudioRef, reservationAudioRef,
        planChangeFormAudioRef, lineIntroAudioRef, lineAccountAudioRef, welcomeAudioRef
      ];

      const stopAreaAudio = () => {
        areaAudioRefs.forEach((ref) => {
          if (ref.current) {
            ref.current.pause();
            ref.current.currentTime = 0;
          }
        });
      };

      // エリアのナレーション再生（前のナレーションを止めてから鳴らす）
      const playAreaAudio = (ref) => {
        stopAreaAudio();
        if (ref.current) {
          ref.current.currentTime = 0;
          ref.current.play().catch(error => {
            console.log('音声の再生に失敗しました:', error);
          });
        }
      };

      // ボタンのクリック音再生（ナレーションとは独立して最後まで鳴らす）
      const playClickAudio = (ref) => {
        if (ref.current) {
          ref.current.currentTime = 0;
          ref.current.play().catch(error => {
            console.log('音声の再生に失敗しました:', error);
          });
        }
      };

      // ボタン押下時の効果音（クリックイベントの委譲で全ボタンに対応）
      // ボタンに data-sound="decision" / "cancel" があればそれを優先し、なければ見た目（色）から判定する
      const handleAreaClick = (e) => {
        const button = e.target.closest('button');
        if (!button) return;
        const override = button.dataset.sound;
        const isCancelStyle = button.className.includes('bg-gray-500') || button.className.includes('secondary-button');
        const isCancel = override ? override === 'cancel' : isCancelStyle;
        playClickAudio(isCancel ? cancelClickAudioRef : decisionClickAudioRef);
      };

      // 各エリア到達時の音声再生
      // ①は起動直後で自動再生されてしまうとブラウザの制限で鳴らないため、タップ操作（hasStarted）を待ってから鳴らす
      // ※依存配列に language を入れているのは、今いるエリアのまま言語を切り替えたときに、そのエリアの音声を新しい言語で鳴らし直すため
      React.useEffect(() => {
        if (currentStep === 1 && hasStarted) playAreaAudio(planAudioRef);
      }, [currentStep, hasStarted, language]);

      React.useEffect(() => {
        if (currentStep === 2) playAreaAudio(confirmDocAudioRef);
      }, [currentStep, language]);

      React.useEffect(() => {
        if (currentStep === 2.2) playAreaAudio(termsAudioRef);
      }, [currentStep, language]);

      React.useEffect(() => {
        if (currentStep === 2.3) playAreaAudio(soccerAudioRef);
      }, [currentStep, language]);

      React.useEffect(() => {
        if (currentStep === 2.4) playAreaAudio(teddyAudioRef);
      }, [currentStep, language]);

      React.useEffect(() => {
        if (currentStep === 2.5) playAreaAudio(planChangeFormAudioRef);
      }, [currentStep, language]);

      // お会計画面：呼び出し音を鳴らしてから、続けて会計の音声を再生する
      React.useEffect(() => {
        if (currentStep === 3 && callAudioRef.current) {
          const callAudio = callAudioRef.current;
          const playKaikei = () => playAreaAudio(kaikeiAudioRef);
          callAudio.addEventListener('ended', playKaikei);
          playAreaAudio(callAudioRef);
          return () => callAudio.removeEventListener('ended', playKaikei);
        }
      }, [currentStep, language]);

      // 完了画面：歓声と拍手を鳴らしてから、続けてようこその音声を再生する
      React.useEffect(() => {
        if (currentStep === 7 && cheerAudioRef.current) {
          const cheerAudio = cheerAudioRef.current;
          const playWelcome = () => playAreaAudio(welcomeAudioRef);
          cheerAudio.addEventListener('ended', playWelcome);
          playAreaAudio(cheerAudioRef);
          return () => cheerAudio.removeEventListener('ended', playWelcome);
        }
      }, [currentStep, language]);

      React.useEffect(() => {
        if (currentStep === 6) playAreaAudio(lineIntroAudioRef);
      }, [currentStep, language]);

      React.useEffect(() => {
        if (currentStep === 6.5) playAreaAudio(lineAccountAudioRef);
      }, [currentStep, language]);

      React.useEffect(() => {
        if (currentStep === 4) playAreaAudio(cashCardAudioRef);
      }, [currentStep, language]);

      // ④-2 ご自宅での口座振替のご案内：1つ目の音声を鳴らしてから、続けて2つ目の音声を再生する
      React.useEffect(() => {
        if (currentStep === 4.2 && accountHomeAudioRef.current) {
          const audio1 = accountHomeAudioRef.current;
          const playPart2 = () => playAreaAudio(accountHomeAudioRef2);
          audio1.addEventListener('ended', playPart2);
          playAreaAudio(accountHomeAudioRef);
          return () => audio1.removeEventListener('ended', playPart2);
        }
      }, [currentStep, language]);

      // ④-5 振替口座登録：1つ目の音声を鳴らしてから、続けて2つ目の音声を再生する（日本語は2つ目が無いので1本のみで終わる）
      React.useEffect(() => {
        if (currentStep === 4.5 && accountRegisterAudioRef.current) {
          const audio1 = accountRegisterAudioRef.current;
          const playPart2 = () => playAreaAudio(accountRegisterAudioRef2);
          audio1.addEventListener('ended', playPart2);
          playAreaAudio(accountRegisterAudioRef);
          return () => audio1.removeEventListener('ended', playPart2);
        }
      }, [currentStep, language]);

      React.useEffect(() => {
        if (currentStep === 4.8) playAreaAudio(accountWebAudioRef);
      }, [currentStep, language]);

      React.useEffect(() => {
        if (currentStep === 5) playAreaAudio(reservationAudioRef);
      }, [currentStep, language]);

      // プラン変更の事務処理期限超過モーダルが表示されたときの音声
      React.useEffect(() => {
        if (showLateModal) playAreaAudio(planChangeDeadlineAudioRef);
      }, [showLateModal, language]);

      // 入会金の表示金額を取得
      const getDisplayRegistrationFee = () => {
        return joinAtTrial ? registrationFee - 1000 : registrationFee;
      };

      // 金額表示（日本語は「12,345円」、英語は「¥12,345」）
      const renderFee = (amount) => (
        language === 'en'
          ? <React.Fragment>¥{amount.toLocaleString()}</React.Fragment>
          : <React.Fragment>{amount.toLocaleString()}<span className="text-sm">円</span></React.Fragment>
      );
      const renderFeePerMonth = (amount) => (
        language === 'en'
          ? <React.Fragment>¥{amount.toLocaleString()}/month</React.Fragment>
          : <React.Fragment>{amount.toLocaleString()}円／月</React.Fragment>
      );

      // プラン・回数の表示ラベル（value は日本語のまま、表示だけ切り替える）
      const planLabel = (key) => key ? (PLAN_LABELS[language][key] || key) : '';
      const freqLabel = (key) => key ? (FREQUENCY_LABELS[language][key] || key) : '';

      // 次のステップへ進む処理
      const proceedToNextStep = () => {
        setCurrentStep(2);
        setTimeout(() => {
          document.getElementById('section-2')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      };

      return (
        <div className="h-screen flex flex-col bg-gray-100" onClick={handleAreaClick}>
          {/* 言語切り替えスイッチ（画面右上・エリアの外に固定表示） */}
          <div
            className="lang-switch fixed top-2 right-2 z-[60] flex rounded-full overflow-hidden shadow-lg border border-gray-300 bg-white text-sm font-bold"
            onClick={(e) => e.stopPropagation()}
          >
            <button
              type="button"
              className={`px-3 py-1 ${language === 'ja' ? 'bg-orange-500 text-white' : 'bg-white text-gray-600'}`}
              onClick={() => setLanguage('ja')}
            >
              日本語
            </button>
            <button
              type="button"
              className={`px-3 py-1 ${language === 'en' ? 'bg-orange-500 text-white' : 'bg-white text-gray-600'}`}
              onClick={() => setLanguage('en')}
            >
              EN
            </button>
          </div>

          {/* 起動直後はブラウザの自動再生制限で音声が鳴らないため、最初にタップしてもらう画面 */}
          {!hasStarted && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70"
              onClick={() => setHasStarted(true)}
            >
              <div className="bg-white rounded-lg p-10 text-center shadow-lg">
                <p className="text-2xl font-bold">{L.tapToStart}</p>
              </div>
            </div>
          )}

          {/* プロセス表示部分（flex-wrapで折り返し対応） */}
          <div className="bg-white shadow-md p-4">
            <div className="flex flex-wrap justify-center items-center gap-2">
              <div className={`px-3 py-1 rounded-lg font-bold text-sm ${currentStep === 1 ? 'process-active' : 'process-inactive'}`}>
                {L.stepPlan}
              </div>
              <div className="text-lg">→</div>
              <div className={`px-3 py-1 rounded-lg font-bold text-sm ${currentStep >= 2 && currentStep < 3 ? 'process-active' : 'process-inactive'}`}>
                {L.stepConfirm}
              </div>
              {showPlanChangeForm && (
                <React.Fragment>
                  <div className="text-lg">→</div>
                  <div className={`px-3 py-1 rounded-lg font-bold text-sm ${currentStep === 2.5 ? 'process-active' : 'process-inactive'}`}>
                    {L.stepPlanChange}
                  </div>
                </React.Fragment>
              )}
              <div className="text-lg">→</div>
              <div className={`px-3 py-1 rounded-lg font-bold text-sm ${currentStep === 3 ? 'process-active' : 'process-inactive'}`}>
                {L.stepPayment}
              </div>
              <div className="text-lg">→</div>
              <div className={`px-3 py-1 rounded-lg font-bold text-sm ${currentStep >= 4 && currentStep < 5 ? 'process-active' : 'process-inactive'}`}>
                {L.stepDebit}
              </div>
              <div className="text-lg">→</div>
              <div className={`px-3 py-1 rounded-lg font-bold text-sm ${currentStep === 5 ? 'process-active' : 'process-inactive'}`}>
                {L.stepBooking}
              </div>
              <div className="text-lg">→</div>
              <div className={`px-3 py-1 rounded-lg font-bold text-sm ${currentStep >= 6 && currentStep < 7 ? 'process-active' : 'process-inactive'}`}>
                {L.stepLine}
              </div>
              <div className="text-lg">→</div>
              <div className={`px-3 py-1 rounded-lg font-bold text-sm ${currentStep === 7 ? 'process-active' : 'process-inactive'}`}>
                {L.stepComplete}
              </div>
            </div>
          </div>

          {/* メインコンテンツ */}
          <div className="flex-1 p-4 lg:p-8 overflow-auto">
            <div className="max-w-7xl mx-auto space-y-6">

              {/* ①プラン決めセクション */}
              <div id="section-1" className={`p-6 rounded-lg shadow-lg ${currentStep === 1 ? 'active-section' : 'inactive-section'}`}>
                <h2 className="text-2xl font-bold mb-6 text-center">{L.s1Title}</h2>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  {/* 左側：入力 */}
                  <div className="space-y-4">
                    <div className={changePlanNextMonth ? 'bg-white p-4 rounded-lg' : ''}>
                      <div>
                        <label className="block mb-2 font-medium text-lg">
                          {changePlanNextMonth ? L.planLabelThisMonth : L.planLabelPlain}
                        </label>
                        <select
                          className="w-full p-3 border rounded text-lg"
                          value={plan}
                          onChange={(e) => setPlan(e.target.value)}
                          disabled={currentStep !== 1}
                        >
                          <option value="" disabled>{L.selectPlanPlaceholder}</option>
                          <option value="フルタイム">{planLabel("フルタイム")}</option>
                          <option value="平日フル">{planLabel("平日フル")}</option>
                          <option value="いつでも夕方">{planLabel("いつでも夕方")}</option>
                        </select>
                      </div>

                      <div className="mt-4">
                        <label className="block mb-2 font-medium text-lg">
                          {changePlanNextMonth ? L.freqLabelThisMonth : L.freqLabelPlain}
                        </label>
                        <select
                          className="w-full p-3 border rounded text-lg"
                          value={frequency}
                          onChange={(e) => setFrequency(e.target.value)}
                          disabled={currentStep !== 1}
                        >
                          <option value="" disabled>{L.selectFreqPlaceholder}</option>
                          <option value="月2回">{freqLabel("月2回")}</option>
                          <option value="月3回">{freqLabel("月3回")}</option>
                          <option value="月4回">{freqLabel("月4回")}</option>
                          <option value="月6回">{freqLabel("月6回")}</option>
                        </select>
                      </div>
                    </div>

                    <div className="flex items-center">
                      <input
                        type="checkbox"
                        id="joinAtTrial"
                        className="mr-3 h-5 w-5"
                        checked={joinAtTrial}
                        onChange={(e) => setJoinAtTrial(e.target.checked)}
                        disabled={currentStep !== 1}
                      />
                      <label htmlFor="joinAtTrial" className="text-lg">{L.joinAtTrialLabel}</label>
                    </div>

                    <div className="space-y-3 mt-4">
                      <div className="flex items-center">
                        <input
                          type="radio"
                          id="startThisMonth"
                          name="startTiming"
                          className="mr-3 h-5 w-5"
                          value="今月から始める"
                          checked={startTiming === "今月から始める"}
                          onChange={(e) => setStartTiming(e.target.value)}
                          disabled={currentStep !== 1}
                        />
                        <label htmlFor="startThisMonth" className="text-lg">{L.startThisMonthLabel}</label>
                      </div>

                      {startTiming === "今月から始める" && (
                        <div className="flex items-center ml-8">
                          <input
                            type="checkbox"
                            id="changePlanNextMonth"
                            className="mr-3 h-5 w-5"
                            checked={changePlanNextMonth}
                            onChange={(e) => {
                              const isChecked = e.target.checked;
                              // 20日以降にチェックを入れた場合はポップアップを表示
                              if (isChecked && today.getDate() >= 20) {
                                setShowLateModal(true);
                                setChangePlanNextMonth(true);
                              } else {
                                setChangePlanNextMonth(isChecked);
                                setIsDelayedChange(false);
                              }
                            }}
                            disabled={currentStep !== 1}
                          />
                          <label htmlFor="changePlanNextMonth" className="text-lg">{L.changePlanNextMonthLabel}</label>
                        </div>
                      )}

                      <div className="flex items-center">
                        <input
                          type="radio"
                          id="startNextMonth"
                          name="startTiming"
                          className="mr-3 h-5 w-5"
                          value="来月から始める"
                          checked={startTiming === "来月から始める"}
                          onChange={(e) => {
                            setStartTiming(e.target.value);
                            if (e.target.value === "来月から始める") {
                              setChangePlanNextMonth(false);
                              setIsDelayedChange(false);
                            }
                          }}
                          disabled={currentStep !== 1}
                        />
                        <label htmlFor="startNextMonth" className="text-lg">{L.startNextMonthLabel}</label>
                      </div>
                    </div>

                    {changePlanNextMonth && startTiming === "今月から始める" && (
                      <div className="bg-white p-4 rounded-lg mt-4">
                        <div>
                          <label className="block mb-2 font-medium text-lg">{nextMonthPlanFieldLabel}</label>
                          <select
                            className="w-full p-3 border rounded text-lg"
                            value={nextMonthPlan}
                            onChange={(e) => setNextMonthPlan(e.target.value)}
                            disabled={currentStep !== 1}
                          >
                            <option value="" disabled>{L.selectPlanPlaceholder}</option>
                            <option value="フルタイム">{planLabel("フルタイム")}</option>
                            <option value="平日フル">{planLabel("平日フル")}</option>
                            <option value="いつでも夕方">{planLabel("いつでも夕方")}</option>
                          </select>
                        </div>

                        <div className="mt-4">
                          <label className="block mb-2 font-medium text-lg">{nextMonthFreqFieldLabel}</label>
                          <select
                            className="w-full p-3 border rounded text-lg"
                            value={nextMonthFrequency}
                            onChange={(e) => setNextMonthFrequency(e.target.value)}
                            disabled={currentStep !== 1}
                          >
                            <option value="" disabled>{L.selectFreqPlaceholder}</option>
                            <option value="月2回">{freqLabel("月2回")}</option>
                            <option value="月3回">{freqLabel("月3回")}</option>
                            <option value="月4回">{freqLabel("月4回")}</option>
                            <option value="月6回">{freqLabel("月6回")}</option>
                          </select>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* 右側：計算結果 */}
                  <div className="space-y-4">
                    <h3 className="font-bold text-xl border-b pb-2">{L.todayCost}</h3>
                    <div className="flex justify-between items-baseline text-lg">
                      <span>{L.enrollmentFee}</span>
                      <span>{renderFee(getDisplayRegistrationFee())}</span>
                    </div>
                    {/* 今月から始めるか来月から始めるかで内訳の行数を変更 */}
                    {startTiming === "今月から始める" ? (
                      <React.Fragment>
                        <div className="flex justify-between items-baseline text-lg">
                          <span>{L.thisMonthTuition}</span>
                          <span>{renderFee(thisMonthFee)}</span>
                        </div>
                        <div className="flex justify-between items-baseline text-lg">
                          <span>{L.nextMonthTuition}</span>
                          <span>{renderFee(nextMonthFee)}</span>
                        </div>
                      </React.Fragment>
                    ) : (
                      <div className="flex justify-between items-baseline text-lg">
                        <span>{L.nextMonthTuition}</span>
                        <span>{renderFee(nextMonthFee)}</span>
                      </div>
                    )}

                    <div className="flex justify-between items-baseline font-bold text-xl border-t pt-2">
                      <span>{L.todayTotal}</span>
                      <span>{renderFee(thisMonthTotal)}</span>
                    </div>

                    <h3 className={`font-bold text-xl border-b pb-2 ${changePlanNextMonth && startTiming === "今月から始める" ? 'mt-32' : 'mt-28'}`}>
                      {L.afterNextCostTitle(afterNextMonthLabel)}
                    </h3>
                    <div className="flex justify-between items-baseline text-lg">
                      <span>{L.tuition}</span>
                      <span>{renderFee(nextMonthTotal)}</span>
                    </div>
                  </div>
                </div>

                <div className="mt-8 flex justify-between">
                  <button
                    className="primary-button px-8 py-4 rounded-lg text-xl font-bold disabled:opacity-50"
                    onClick={() => proceedToNextStep()}
                    disabled={!plan || !frequency || (changePlanNextMonth && (!nextMonthPlan || !nextMonthFrequency))}
                  >
                    {L.confirmPlanButton}
                  </button>
                </div>
              </div>

              {/* ②確認書セクション（1/4：受講者情報） */}
              <div id="section-2" className={`relative p-6 rounded-lg shadow-lg overflow-hidden ${currentStep === 2 ? 'active-section' : 'inactive-section'}`}>
                {/* イルカの背景 */}
                <div className="absolute -left-10 top-1/2 transform -translate-y-1/2 text-[250px] opacity-50 pointer-events-none select-none z-0">
                  🐬
                </div>

                <h2 className="text-2xl font-bold mb-6 text-center relative z-10">{L.s2Title}</h2>

                <div className="max-w-2xl mx-auto space-y-6 relative z-10">
                  <div className="bg-white p-6 rounded-lg">
                    <h3 className="font-bold text-xl border-b pb-2 mb-4">{L.s2SubStudentInfo}</h3>

                    <table className="w-full text-left border-collapse">
                      <tbody>

                    src="./LINEQR.png"
                    alt={L.lineQrAlt}
                    style={{
                      width: "250px",
                      height: "250px",
                      objectFit: "contain",
                      border: "1px solid #ddd"
                    }}
                    onError={(e) => {
                      console.error("画像読み込みエラー:", e.target.src);
                      e.target.style.display = 'none';
                      e.target.nextSibling.style.display = 'flex';
                    }}
                  />
                  {/* 画像が読み込めなかった場合のプレースホルダー */}
                  <div
                    className="qr-placeholder"
                    style={{
                      display: 'none',
                      width: "250px",
                      height: "250px"
                    }}
                  >
                    <div className="text-center">
                      <p className="text-sm">LINE<br/>{L.qrCodeWord}</p>
                    </div>
                  </div>
                </div>

                <div className="flex justify-between mt-8 w-full max-w-2xl mx-auto">
                  <button
                    className="px-6 py-3 bg-gray-500 text-white rounded-lg text-lg font-bold hover:bg-gray-600"
                    onClick={() => {
                      setCurrentStep(5);
                      setTimeout(() => {
                        document.getElementById('section-5')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                      }, 100);
                    }}
                  >
                    {L.back}
                  </button>
                  <button
                    className="primary-button px-6 py-3 rounded-lg text-lg font-bold"
                    onClick={() => {
                      setCurrentStep(6.5);
                      setTimeout(() => {
                        document.getElementById('section-6-5')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                      }, 100);
                    }}
                  >
                    {L.nextDone}
                  </button>
                </div>
              </div>

              {/* ⑥-2 LINEから予約がとれるようにするセクション */}
              <div id="section-6-5" className={`p-6 rounded-lg shadow-lg ${currentStep === 6.5 ? 'active-section' : 'inactive-section'}`}>
                <h2 className="text-2xl font-bold mb-6 text-center">{L.s6_5Title}</h2>

                <div className="flex flex-col items-center space-y-6 py-8 text-center">
                  <p className="text-xl font-bold leading-relaxed">
                    {L.lineAccountText}
                  </p>

                  <img
                    src="./20250528来月以降の月謝登録手順 (1).jpg"
                    alt={L.lineStepsAlt}
                    style={{
                      maxWidth: "100%",
                      width: "600px",
                      objectFit: "contain",
                      border: "1px solid #ddd"
                    }}
                  />
                </div>

                <div className="flex justify-between mt-8 w-full max-w-2xl mx-auto">
                  <button
                    className="px-6 py-3 bg-gray-500 text-white rounded-lg text-lg font-bold hover:bg-gray-600"
                    onClick={() => {
                      setCurrentStep(6);
                      setTimeout(() => {
                        document.getElementById('section-6')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                      }, 100);
                    }}
                  >
                    {L.back}
                  </button>
                  <button
                    className="primary-button px-6 py-3 rounded-lg text-lg font-bold"
                    onClick={() => {
                      setCurrentStep(7);
                      setTimeout(() => {
                        document.getElementById('section-7')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                      }, 100);
                    }}
                  >
                    {L.nextDone}
                  </button>
                </div>
              </div>

              {/* ⑦完了セクション */}
              <div id="section-7" className={`relative p-6 rounded-lg shadow-lg overflow-hidden ${currentStep === 7 ? 'active-section' : 'inactive-section'}`}>
                {/* 紙吹雪の背景 */}
                <img
                  src="./confetti-10.gif"
                  alt={L.confettiAlt}
                  className="absolute top-0 left-0 h-full object-cover opacity-80 pointer-events-none z-0"
                />
                <img
                  src="./confetti-10.gif"
                  alt={L.confettiAlt}
                  className="absolute top-0 right-0 h-full object-cover opacity-80 pointer-events-none transform scale-x-[-1] z-0"
                />

                <h2 className="text-2xl font-bold mb-6 text-center relative z-10">{L.s7Title}</h2>

                <div className="relative z-10 flex flex-col items-center justify-center space-y-8 py-10">
                  <div className="text-center space-y-6">
                    <h3 className="text-3xl md:text-4xl font-bold text-black leading-relaxed">
                      {L.welcomeLine1}<br/>{L.welcomeLine2}
                    </h3>
                    <p className="text-xl font-medium">
                      {L.enjoyText}
                    </p>
                    <p className="text-xl font-bold text-red-600">
                      {L.receiveGiftText}
                    </p>
                  </div>
                </div>
              </div>

            </div>
          </div>

          {/* モーダル表示部分（20日以降プラン変更警告） */}
          {showLateModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <p className="text-lg mb-8 font-bold leading-relaxed text-left">
                  {L.lateModalText1}<br/>
                  {L.lateModalText2(afterNextMonthLabel)}
                </p>
                <div className="flex justify-center space-x-6">
                  {/* はいボタン */}
                  <button
                    className="primary-button px-8 py-3 rounded-lg text-lg font-bold flex items-center"
                    onClick={() => {
                      setIsDelayedChange(true);
                      setShowLateModal(false);
                    }}
                  >
                    {L.yes}<span className="ml-2" style={{color: 'green'}}>✅</span>
                  </button>
                  {/* いいえボタン */}
                  <button
                    className="secondary-button px-8 py-3 rounded-lg text-lg font-bold flex items-center"
                    onClick={() => {
                      setChangePlanNextMonth(false);
                      setIsDelayedChange(false);
                      setShowLateModal(false);
                    }}
                  >
                    {L.no}<span className="ml-2 font-bold" style={{color: 'red'}}>✖</span>
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    // コンポーネントをレンダリング
    ReactDOM.render(
      <App />,
      document.getElementById('app-container')
    );
  </script>
</body>
</html>
